<!doctype html><html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMIN EMPIRE — Admin Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial}.top{height:65px;background:#111;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 4%}.gold{color:#d8b35b}main{max-width:1200px;margin:auto;padding:22px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}button{border:0;border-radius:9px;padding:10px 14px;background:#d8b35b;font-weight:800;cursor:pointer}button.dark{background:#202020;color:#fff;border:1px solid #3a3a3a}button.danger{background:#8d2525;color:#fff}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#141414;border:1px solid #303030;border-radius:16px;padding:17px;margin-bottom:14px}.stat b{font-size:28px;display:block;margin-top:7px}.muted{color:#999}input,textarea,select{width:100%;padding:11px;margin:6px 0;background:#202020;color:#fff;border:1px solid #444;border-radius:8px}.row{padding:13px 0;border-bottom:1px solid #292929}.flex{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hidden{display:none}
</style></head><body>
<div class="top"><b>👑 AMIN <span class="gold">EMPIRE</span> — ADMIN PRO</b><button class="dark" onclick="location.href='index.html'">Student Site</button></div>
<main>
<div id="login" class="card"><h2>🔐 Admin Login</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Ворид шудан</button><p id="err" class="muted"></p></div>
<div id="app" class="hidden">
<div class="tabs"><button onclick="tab('dash')">📊 Dashboard</button><button onclick="location.href='analytics.html'">📈 Analytics</button><button onclick="tab('courses')">📚 Courses</button><button onclick="tab('students')">👥 Students</button><button onclick="tab('orders')">💳 Orders</button><button onclick="tab('certs')">🏆 Certificates</button><button onclick="tab('notify')">📢 Notify</button><button class="dark" onclick="logout()">Logout</button></div>
<section id="dash" class="page active"><div class="grid"><div class="card stat">Students<b id="nStudents">0</b></div><div class="card stat">Courses<b id="nCourses">0</b></div><div class="card stat">Orders<b id="nOrders">0</b></div><div class="card stat">Revenue<b id="nRevenue">0 TJS</b></div></div></section>
<section id="courses" class="page"><div class="card"><h2>➕ Course</h2><input id="ctitle" placeholder="Номи курс"><textarea id="cdesc" placeholder="Тавсиф"></textarea><input id="cprice" type="number" placeholder="Нарх"><button onclick="createCourse()">Сохтан</button></div><div class="card"><h2>📚 Course Manager</h2><div id="courseList"></div></div></section>
<section id="students" class="page"><div class="card"><h2>👥 Students</h2><div id="studentList"></div></div></section>
<section id="studentDetail" class="page"><div class="card"><div class="flex"><h2>👤 Student Profile</h2><button class="dark" onclick="tab('students')">← Back</button></div><div id="detail"></div></div></section>
<section id="orders" class="page"><div class="card"><h2>💳 Orders</h2><div id="orderList"></div></div></section>
<section id="certs" class="page"><div class="card"><h2>🏆 Certificates</h2><div id="certList"></div></div></section><section id="notify" class="page"><div class="card"><h2>📢 Send Notification</h2>
<input id="ntitle" placeholder="Сарлавҳа">
<textarea id="nmessage" placeholder="Матни notification"></textarea>
<select id="ntype"><option value="info">ℹ️ Info</option><option value="success">✅ Success</option><option value="course">📚 Course</option><option value="promo">🎁 Promo</option></select>
<input id="nuser" type="number" placeholder="Student ID (холӣ = ба ҳамаи донишҷӯён)">
<button onclick="sendNotification()">📤 Ирсол кардан</button><p id="notifyOut" class="muted"></p></div></section>
</div></main>
<script>
const API=location.origin;let token=localStorage.getItem("AE_ADMIN_TOKEN");
async function api(p,o={}){o.headers=Object.assign({"Content-Type":"application/json"},o.headers||{});if(token)o.headers.Authorization="Bearer "+token;let r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Error");return d}
async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});if(d.user.role!=="admin")throw Error("Ин admin нест");token=d.token;localStorage.setItem("AE_ADMIN_TOKEN",token);openApp()}catch(e){err.textContent="❌ "+e.message}}
function openApp(){loginBox(true);loadAll()}function loginBox(on){login.classList.toggle("hidden",on);app.classList.toggle("hidden",!on)}
function tab(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
async function loadAll(){try{let s=await api("/api/admin/stats");nStudents.textContent=s.students;nCourses.textContent=s.courses;nOrders.textContent=s.orders;nRevenue.textContent=s.revenue+" TJS";let cs=await api("/api/courses");courseList.innerHTML=cs.map(c=>`<div class="row"><div class="flex"><div><b>${esc(c.title)}</b><div class="muted">${esc(c.description||"")} · ${c.price} ${c.currency} · ${c.published?"Published":"Hidden"}</div></div><div><button onclick="editCourse(${c.id},'${js(c.title)}','${js(c.description||"")}',${c.price},'${c.currency}',${c.published})">Edit</button><button class="dark" onclick="addLesson(${c.id})">+ Lesson</button><button class="dark" onclick="addQuiz(${c.id})">+ Quiz</button><button class="danger" onclick="deleteCourse(${c.id})">Delete</button></div></div></div>`).join("")||"Курс нест.";
let st=await api("/api/admin/students");studentList.innerHTML=st.map(x=>`<div class="row"><div class="flex"><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.email)} · ${x.role}</span></div><button onclick="studentDetails(${x.id})">View</button></div></div>`).join("")||"Нет";
let os=await api("/api/admin/orders");orderList.innerHTML=os.map(x=>`<div class="row"><b>#${x.id} · ${esc(x.courseTitle)}</b><br>${esc(x.userName)} · ${x.amount} ${x.currency} · <b>${x.status}</b><br><span class="muted">${x.provider||"unconfigured"}</span></div>`).join("")||"Нет";
let ce=await api("/api/admin/certificates");certList.innerHTML=ce.map(x=>`<div class="row"><b>${esc(x.certificate_id)}</b><br>${esc(x.userName)} · ${esc(x.courseTitle)} · ${x.completion_percent}%</div>`).join("")||"Нет";
}catch(e){if(e.message==="Unauthorized"){logout()}else alert(e.message)}}
async function createCourse(){try{await api("/api/admin/courses",{method:"POST",body:JSON.stringify({title:ctitle.value,description:cdesc.value,price:Number(cprice.value||0),currency:"TJS"})});ctitle.value=cdesc.value=cprice.value="";loadAll()}catch(e){alert(e.message)}}
async function editCourse(id,t,d,p,c,pub){let nt=prompt("Номи курс:",t);if(nt===null)return;let nd=prompt("Тавсиф:",d);if(nd===null)return;let np=prompt("Нарх:",p);if(np===null)return;let hidden=confirm("OK = Published, Cancel = Hidden");try{await api("/api/admin/courses/"+id,{method:"PUT",body:JSON.stringify({title:nt,description:nd,price:Number(np),currency:c,published:hidden})});loadAll()}catch(e){alert(e.message)}}
async function deleteCourse(id){if(!confirm("Курсро нест мекунем?"))return;try{await api("/api/admin/courses/"+id,{method:"DELETE"});loadAll()}catch(e){alert(e.message)}}
async function addLesson(id){let t=prompt("Номи дарс:");if(!t)return;let c=prompt("Матни дарс:")||"";try{await api("/api/admin/courses/"+id+"/lessons",{method:"POST",body:JSON.stringify({title:t,content:c,position:Date.now()})});alert("Дарс илова шуд")}catch(e){alert(e.message)}}
async function addQuiz(id){let t=prompt("Номи Quiz:");if(!t)return;let p=prompt("Pass %:",70);try{let q=await api("/api/admin/courses/"+id+"/quizzes",{method:"POST",body:JSON.stringify({title:t,passPercent:Number(p||70)})});let question=prompt("Саволро ворид кунед:");if(question){let A=prompt("Option A:"),B=prompt("Option B:"),C=prompt("Option C:"),D=prompt("Option D:"),correct=prompt("Ҷавоби дуруст: A/B/C/D");await api("/api/admin/quizzes/"+q.id+"/questions",{method:"POST",body:JSON.stringify({question,optionA:A,optionB:B,optionC:C,optionD:D,correctOption:correct})})}alert("Quiz сохта шуд")}catch(e){alert(e.message)}}
async function sendNotification(){try{let d=await api("/api/admin/notifications",{method:"POST",body:JSON.stringify({title:ntitle.value,message:nmessage.value,type:ntype.value,userId:nuser.value?Number(nuser.value):undefined})});notifyOut.textContent=`✅ Ирсол шуд: ${d.sent} донишҷӯ`;ntitle.value=nmessage.value=nuser.value=""}catch(e){notifyOut.textContent="❌ "+e.message}}
async function studentDetails(id){try{let s=await api("/api/admin/students/"+id);tab("studentDetail");detail.innerHTML=`<h3>${esc(s.name)}</h3><p class="muted">${esc(s.email)}</p><p>⭐ XP: <b>${s.xp.xp}</b> · 🆙 Level: <b>${s.xp.level}</b></p><h3>📚 Courses</h3>${s.courses.map(c=>`<div class="row"><b>${esc(c.title)}</b><br>${c.progress}% · ${c.status}</div>`).join("")||"No courses"}<h3>🏆 Certificates</h3>${s.certificates.map(c=>`<div class="row"><b>${esc(c.certificate_id)}</b> · ${esc(c.courseTitle)} · ${c.completion_percent}%</div>`).join("")||"No certificates"}<h3>🏅 Achievements</h3>${s.achievements.map(x=>`<div class="row">${x.icon} <b>${esc(x.title)}</b> · ${esc(x.earned_at)}</div>`).join("")||"No achievements"}`}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem("AE_ADMIN_TOKEN");token=null;location.reload()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function js(x){return String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/[\r\n]/g," ")}
if(token)openApp();
</script></body></html>
