<!doctype html><html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMIN EMPIRE — Dashboard</title>
<style>body{margin:0;background:#080808;color:#fff;font-family:Arial}.wrap{max-width:950px;margin:auto;padding:22px}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:13px;color:#999}.stat b{display:block;color:#fff;font-size:27px;margin-top:7px}.course{padding:14px;border:1px solid #333;border-radius:12px;margin:8px 0}.bar{height:9px;background:#292929;border-radius:99px;overflow:hidden}.fill{height:100%;background:#d8b35b}.gold{color:#d8b35b}button{background:#d8b35b;border:0;border-radius:9px;padding:10px 14px;font-weight:bold}</style></head>
<body><div class="wrap"><div class="card"><h1>👑 AMIN <span class="gold">EMPIRE</span></h1><p id="name"></p></div><div class="grid"><div class="card stat">⭐ XP<b id="xp">0</b></div><div class="card stat">🆙 Level<b id="level">1</b></div><div class="card stat">📚 Courses<b id="count">0</b></div><div class="card stat">🏆 Certificates<b id="certs">0</b></div></div><div class="card"><h2>📚 Курсҳои ман</h2><div id="courses">Loading...</div></div><div class="card"><h2>🏆 Сертификатҳо</h2><div id="certList">Loading...</div></div><button onclick="location.href='rewards.html'">🏅 Rewards</button> <button onclick="location.href='notifications.html'">🔔 Notifications</button> <button onclick="location.href='index.html'">🏠 Платформа</button></div>
<script>
const API=location.origin,T=localStorage.getItem("AE_TOKEN");async function api(p){let r=await fetch(API+p,{headers:{Authorization:"Bearer "+T}}),d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
async function init(){try{let m=await api("/api/me"),x=await api("/api/me/xp"),cs=await api("/api/my-courses"),ce=await api("/api/my-certificates");name.textContent=`Салом, ${m.name}`;xp.textContent=x.xp;level.textContent=x.level;count.textContent=cs.length;certs.textContent=ce.length;courses.innerHTML=cs.map(c=>`<div class="course"><b>${esc(c.title)}</b><p>${c.progress}%</p><div class="bar"><div class="fill" style="width:${c.progress}%"></div></div><br><button onclick="location.href='lesson.html?courseId=${c.id}'">📖 Давом додан</button></div>`).join("")||"Курс надоред.";certList.innerHTML=ce.map(c=>`<div class="course"><b>${esc(c.certificate_id)}</b><br>${esc(c.courseTitle)} · ${c.completion_percent}%</div>`).join("")||"Ҳоло сертификат нест."}catch(e){document.body.innerHTML="<div style='padding:30px;color:white'>❌ "+e.message+"</div>"}}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}init();
</script></body></html>
