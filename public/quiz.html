<!doctype html><html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMIN EMPIRE — Quiz</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial}.wrap{max-width:800px;margin:auto;padding:22px}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:14px}.q{padding:14px;border:1px solid #333;border-radius:12px;margin:12px 0}label{display:block;padding:8px;background:#202020;border-radius:8px;margin:5px 0}button{background:#d8b35b;border:0;border-radius:9px;padding:11px 16px;font-weight:bold}.gold{color:#d8b35b}</style></head>
<body><div class="wrap"><div class="card"><h1>👑 AMIN <span class="gold">EMPIRE</span></h1><h2 id="title">Quiz</h2><div id="quiz">Loading...</div><button onclick="submitQuiz()">📤 Супоридан</button><p id="result"></p></div></div>
<script>
const API=location.origin,T=localStorage.getItem("AE_TOKEN"),id=new URLSearchParams(location.search).get("quizId");let questions=[];
async function api(p,o={}){o.headers=Object.assign({"Content-Type":"application/json","Authorization":"Bearer "+T},o.headers||{});let r=await fetch(API+p,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Error");return d}
async function init(){try{let d=await api("/api/quizzes/"+id+"/questions");title.textContent=d.quiz.title+" · Pass "+d.quiz.pass_percent+"%";questions=d.questions;quiz.innerHTML=questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>${["A","B","C","D"].map(o=>`<label><input type="radio" name="q${q.id}" value="${o}"> ${o}. ${esc(q["option_"+o.toLowerCase()])}</label>`).join("")}</div>`).join("")}catch(e){quiz.textContent="❌ "+e.message}}
async function submitQuiz(){let answers={};questions.forEach(q=>{let x=document.querySelector('input[name="q'+q.id+'"]:checked');if(x)answers[q.id]=x.value});try{let d=await api("/api/quizzes/"+id+"/submit",{method:"POST",body:JSON.stringify({answers})});result.innerHTML=d.passed?`🎉 <b>Passed!</b> Натиҷа: ${d.score}%. +100 XP`:`❌ Failed. Натиҷа: ${d.score}%. Боз кӯшиш кунед.`}catch(e){result.textContent="❌ "+e.message}}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}init();
</script></body></html>
